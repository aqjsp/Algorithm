<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="240" rx="12" fill="#fafafa"/>
  <rect width="900" height="240" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">盛水：矮边决定高度，移动矮的那一侧</text>
  <g font-size="11" fill="#546e7a" text-anchor="middle">
    <rect x="80" y="180" width="36" height="16" fill="#90caf9"/>
    <rect x="160" y="68" width="36" height="128" fill="#1565c0"/>
    <rect x="240" y="100" width="36" height="96" fill="#90caf9"/>
    <rect x="320" y="164" width="36" height="32" fill="#90caf9"/>
    <rect x="400" y="116" width="36" height="80" fill="#90caf9"/>
    <rect x="480" y="132" width="36" height="64" fill="#90caf9"/>
    <rect x="560" y="68" width="36" height="128" fill="#90caf9"/>
    <rect x="640" y="148" width="36" height="48" fill="#90caf9"/>
    <rect x="720" y="84" width="36" height="112" fill="#2e7d32"/>
  </g>
  <rect x="178" y="84" width="560" height="112" fill="#bbdefb" fill-opacity="0.45"/>
  <text x="450" y="150" text-anchor="middle" font-size="13" fill="#0d47a1">面积 = min(8,7) × (8-1) = 49</text>
  <text x="98" y="220" text-anchor="middle" font-size="12" fill="#1565c0">L=0</text>
  <text x="738" y="220" text-anchor="middle" font-size="12" fill="#2e7d32">R=8</text>
  <text x="450" y="236" text-anchor="middle" font-size="12" fill="#546e7a">height = [1,8,6,2,5,4,8,3,7]　左边更矮就右移 L</text>
</svg>
